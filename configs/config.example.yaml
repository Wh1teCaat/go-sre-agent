agent:
  max_steps: 12
  llm_timeout: 30s
  tool_timeout: 5s
  skill_path: skills/sre-diagnosis/SKILL.md

policy:
  tool_allowlist:
    - http_check
    - log_read
    - redis_ping
    - postgres_ping
    - postgres_check
    - websocket_check
    - docker_ps
    - docker_inspect
    - docker_logs
  allowed_log_dirs:
    - ./testdata/logs
  allowed_hosts:
    - localhost
    - 127.0.0.1
    - "::1"
  # Docker 工具只能读取这里明确列出的容器，不能执行任意 docker 命令。
  allowed_containers:
    - chat-backend
    - chat-frontend
    - chat-postgres
    - chat-redis-compose

paths:
  run_dir: .runs
  report_dir: reports

targets:
  backend_base_url: http://localhost:8080
  postgres_dsn: postgres://postgres:postgres@localhost:5432/chat_proj?sslmode=disable
  redis_addr: localhost:6379
  websocket_url: ws://localhost:8080/v1/ws
  log_file: ./testdata/logs/chat_proj_error.log
