agent:
  max_steps: 8
  tool_timeout: 5s

policy:
  tool_allowlist:
    - http_check
    - log_read
    - redis_ping
    - postgres_ping
    - websocket_check
  allowed_log_dirs:
    - /home/y2/project/chat_proj/logs
    - ./testdata/logs
  allowed_hosts:
    - localhost
    - 127.0.0.1
    - "::1"

targets:
  backend_base_url: http://localhost:8080
  postgres_dsn: postgres://postgres:postgres@localhost:5432/chat_proj?sslmode=disable
  redis_addr: localhost:6379
  websocket_url: ws://localhost:8080/ws
  log_file: ./testdata/logs/chat_proj_error.log
