# Use only with --mock-scenario tui-demo. All three checks are local simulations.
agent:
  max_steps: 4
  max_parallel_tools: 2
  task_timeout: 30s
policy:
  tool_allowlist:
    - demo_http
    - demo_logs
    - demo_postgres
paths:
  run_dir: .demo-runs
  session_dir: .demo-sessions
  report_dir: .demo-reports
targets:
  service: tui-demo
  environment: demo
